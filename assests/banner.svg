<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Anshul Guleria, AI Backend Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.6" stop-color="#120e0a"/>
      <stop offset="1" stop-color="#26160a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#B45309" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F5E9DA" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="c1"><rect class="r1" x="90" y="200" height="34"/></clipPath>
    <clipPath id="c2"><rect class="r2" x="90" y="200" height="34"/></clipPath>
    <clipPath id="c3"><rect class="r3" x="90" y="200" height="34"/></clipPath>
  </defs>

  <style>
    .mono{font-family:'Courier New',Consolas,Menlo,monospace}
    .serif{font-family:Georgia,'Times New Roman',serif}

    .r1{animation:w1 12s linear infinite}
    .r2{animation:w2 12s linear 4s infinite backwards}
    .r3{animation:w3 12s linear 8s infinite backwards}
    @keyframes w1{0%{width:0}12%{width:300px}32%{width:300px}34%{width:0}100%{width:0}}
    @keyframes w2{0%{width:0}12%{width:410px}32%{width:410px}34%{width:0}100%{width:0}}
    @keyframes w3{0%{width:0}12%{width:300px}32%{width:300px}34%{width:0}100%{width:0}}

    .k1{animation:m1 12s linear infinite}
    .k2{animation:m2 12s linear 4s infinite backwards}
    .k3{animation:m3 12s linear 8s infinite backwards}
    @keyframes m1{0%{transform:translateX(0);opacity:1}12%{transform:translateX(300px)}32%{transform:translateX(300px);opacity:1}34%{opacity:0}100%{transform:translateX(0);opacity:0}}
    @keyframes m2{0%{transform:translateX(0);opacity:0}1%{opacity:1}12%{transform:translateX(410px)}32%{transform:translateX(410px);opacity:1}34%{opacity:0}100%{transform:translateX(0);opacity:0}}
    @keyframes m3{0%{transform:translateX(0);opacity:0}1%{opacity:1}12%{transform:translateX(300px)}32%{transform:translateX(300px);opacity:1}34%{opacity:0}100%{transform:translateX(0);opacity:0}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}

    .flow{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-28}}

    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-out infinite}
    .pulse2{animation-delay:1.5s}
    @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.4);opacity:0}}

    .float{animation:float 5s ease-in-out infinite}
    .float2{animation-delay:-1.7s}
    .float3{animation-delay:-3.2s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- left: identity -->
  <rect x="60" y="66" width="44" height="3" fill="#F59E0B"/>
  <text class="mono" x="60" y="95" font-size="15" letter-spacing="6" fill="#F59E0B">AI BACKEND ENGINEER</text>
  <text class="serif" x="58" y="172" font-size="72" font-style="italic" fill="#F5E9DA">Anshul Guleria</text>

  <text class="mono" x="60" y="224" font-size="22" fill="#F59E0B">&gt;</text>
  <g class="mono" font-size="22" fill="#D9C9B0">
    <text x="90" y="224" clip-path="url(#c1)">Multi-agent AI systems</text>
    <text x="90" y="224" clip-path="url(#c2)">RAG · Fine-tuning · Embeddings</text>
    <text x="90" y="224" clip-path="url(#c3)">FastAPI · Docker · AWS</text>
  </g>
  <g class="k1"><g class="blink"><rect x="92" y="205" width="11" height="24" fill="#F59E0B"/></g></g>
  <g class="k2"><g class="blink"><rect x="92" y="205" width="11" height="24" fill="#F59E0B"/></g></g>
  <g class="k3"><g class="blink"><rect x="92" y="205" width="11" height="24" fill="#F59E0B"/></g></g>

  <!-- right: multi-agent voice pipeline -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path class="flow" d="M790,85 L930,160" stroke="#F59E0B" stroke-opacity="0.85"/>
    <path class="flow" d="M930,160 L1080,85" stroke="#F59E0B" stroke-opacity="0.85"/>
    <path class="flow" d="M930,160 L800,245" stroke="#2DD4BF" stroke-opacity="0.8"/>
    <path class="flow" d="M1075,245 L930,160" stroke="#2DD4BF" stroke-opacity="0.8"/>
  </g>

  <circle class="pulse" cx="930" cy="160" r="38" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle class="pulse pulse2" cx="930" cy="160" r="38" fill="none" stroke="#F59E0B" stroke-width="2"/>

  <g class="mono" text-anchor="middle" font-size="11" fill="#F5E9DA">
    <g class="float">
      <circle cx="790" cy="85" r="27" fill="#0d1117" stroke="#F59E0B" stroke-width="2"/>
      <text x="790" y="89">STT</text>
    </g>
    <g class="float float2">
      <circle cx="1080" cy="85" r="27" fill="#0d1117" stroke="#F59E0B" stroke-width="2"/>
      <text x="1080" y="89">TTS</text>
    </g>
    <g class="float float3">
      <circle cx="800" cy="245" r="27" fill="#0d1117" stroke="#2DD4BF" stroke-width="2"/>
      <text x="800" y="249">TOOLS</text>
    </g>
    <g class="float float2">
      <circle cx="1075" cy="245" r="27" fill="#0d1117" stroke="#2DD4BF" stroke-width="2"/>
      <text x="1075" y="249">MEMORY</text>
    </g>
    <circle cx="930" cy="160" r="38" fill="#1a1108" stroke="#F59E0B" stroke-width="3"/>
    <text x="930" y="165" font-size="14" font-weight="bold" fill="#F59E0B">AGENT</text>
  </g>
</svg>
